name: Refresh ECB data

on:
  schedule:
    - cron: "0 6 3 * *"   # 06:00 UTC on the 3rd of every month
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python run_pipeline.py
      - run: python make_charts.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed docs/images
          git diff --staged --quiet || git commit -m "chore: monthly ECB data refresh"
          git push
